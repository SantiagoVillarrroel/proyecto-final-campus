{% extends "base.html" %}

{% block titulo %}Editar {{ producto.nombre }} · Gestor de Inventario GT{% endblock %}

{% block contenido %}
  <section class="panel estrecho">
    <h1>Editar producto</h1>

    {% if error %}
      <div class="alerta" role="alert">{{ error }}</div>
    {% endif %}

    <form class="formulario" method="post" action="/productos/{{ producto.id }}/editar" data-validar>
      <label>
        Nombre
        <input name="nombre" maxlength="120" required value="{{ producto.nombre }}" />
      </label>
      <label>
        SKU
        <input name="sku" maxlength="40" required value="{{ producto.sku }}" />
      </label>
      <label>
        Precio
        <input name="precio" type="number" step="0.01" min="0" required value="{{ producto.precio }}" />
      </label>
      <label>
        Stock
        <input name="stock" type="number" step="1" min="0" value="{{ producto.stock }}" />
      </label>

      <div class="acciones-form">
        <button type="submit" class="primario">Guardar cambios</button>
        <a class="enlace" href="/">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
